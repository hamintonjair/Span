name: Keep-alive Supabase

on:
  schedule:
    # Cada 3 días a las 09:00 UTC — evita el auto-pause de Supabase (se activa a los ~7 días de inactividad)
    - cron: '0 9 */3 * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping app deployada
        run: |
          if [ -z "${{ vars.APP_URL }}" ]; then
            echo "Falta configurar la variable de repositorio APP_URL (Settings > Secrets and variables > Actions > Variables)"
            exit 1
          fi
          curl -fsS "${{ vars.APP_URL }}/api/keep-alive"
